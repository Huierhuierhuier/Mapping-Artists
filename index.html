<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapping Artists</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

    <!-- PapaParse to parse organ-1910-2 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        .city-label {
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    font-weight: bold;
    font-size: 11px;
    color: #222;
    text-shadow: 1px 1px 2px #fff, -1px -1px 2px #fff, 1px -1px 2px #fff, -1px 1px 2px #fff; /* Weisse Kontur fuer bessere Lesbarkeit */
        }
        CSS
        
        .title-box {
        background: rgba(255, 255, 255, 0.9);
        padding: 8px 12px;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #map {
            width: 100vw;
            height: 100vh;
            background-color: #d4dedd;
        }
        .info.legend {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            line-height: 18px;
            font-size: 12px;
            color: #333;
            font-family: sans-serif;
        }
        .legend-circle {
            border-radius: 50%;
            display: inline-block;
            background: rgba(255, 87, 34, 0.65);
            border: 1px solid #d84315;
            margin-right: 6px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // 1. Initialize Map
        var map = L.map('map').setView([52.0, 25.0], 5);

        // 2. Base map with NO labels
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        // 3. Load 1910 GeoJSON borders (if present)
        fetch('./Weltkarte_1910.geojson')
            .then(function(res) {
                if (!res.ok) throw new Error("GeoJSON not found");
                return res.json();
            })
            .then(function(geojsonData) {
                L.geoJSON(geojsonData, {
                    style: {
                        color: "#777",
                        weight: 1,
                        fillColor: "#bbb",
                        fillOpacity: 0.25
                    }
                }).addTo(map);
            })
            .catch(function(err) {
                console.log("GeoJSON Notice:", err);
            });

        function getRadius(count) {
            return Math.max(5, Math.sqrt(count) * 3.5);
        }
        
        // Titel-Box oben links
        var mapTitle = L.control({ position: 'topleft' });
        mapTitle.onAdd = function() {
            var div = L.DomUtil.create('div', 'info title-box');
            div.innerHTML = '<h3 style="margin:0; font-size: 14px; font-weight: bold; font-family: sans-serif;">Aufenthaltsorte der im "Organ" geführten Artist:innen, Dezember 1910</h3>';
            return div;
        };
        mapTitle.addTo(map);
        
        // 4. Fetch and parse organ-1910-2
        Papa.parse('./organ-1910-2', {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                results.data.forEach(function(row) {
                    var cityName = row.city;
                    var count = parseInt(row.count, 10);
                    var lat = parseFloat(row.lat);
                    var lng = parseFloat(row.lng);

                    if (!isNaN(lat) && !isNaN(lng)) {
                        var circle = L.circleMarker([lat, lng], {
                            radius: getRadius(count),
                            fillColor: "#ff5722",
                            color: "#d84315",
                            weight: 1.5,
                            opacity: 0.9,
                            fillOpacity: 0.65
                        });

                        circle.bindPopup("<b>" + cityName + "</b><br>Anzahl: " + count);
                        circle.addTo(map);
                         // Städtename direkt neben dem Punkt anzeigen
                    circle.bindTooltip(cityName, {
                        permanent: true,
                        direction: 'right',
                        className: 'city-label',
                        offset: [5, 0]
                    });
                    }
                   
                });
            },
            error: function(err) {
                console.error("CSV loading error:", err);
            }
        });

        // 5. Legend
        var legend = L.control({ position: 'bottomright' });
        legend.onAdd = function () {
            var div = L.DomUtil.create('div', 'info legend');
            div.innerHTML = '<strong>Anzahl</strong><br>';
            [1, 5, 10, 27].forEach(function(count) {
                var size = getRadius(count) * 2;
                div.innerHTML += '<div style="margin-top:4px;"><span class="legend-circle" style="width:' + size + 'px; height:' + size + 'px;"></span>' + count + '</div>';
            });
            return div;
        };
        legend.addTo(map);
    </script>

</body>
</html>
